<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Map</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<nav>
<a href="index.html">Home</a>

<main>

<div class="card">

<h2>The Known World</h2>

<p>
Your map will appear below.
</p>

<div class="map-container">

<img src="images/world-map.jpg"
alt="World Map"
class="map-image">

<button class="marker city"
onclick="showLocation('Capital City - The heart of the kingdom. Home of kings, merchants and secrets.')">
🏰
</button>

<button class="marker forest"
onclick="showLocation('Dark Forest - A dangerous place filled with ancient magic.')">
🌲
</button>

<button class="marker dragon"
onclick="showLocation('Dragon Mountains - Something ancient sleeps beneath the peaks.')">
🐉
</button>

</div>


<h2 id="location">
Click a location marker
</h2>


</div>


</main>


<script>

function showLocation(text){

document.getElementById("location").innerHTML=text;

}

</script>


</body>

</html>
