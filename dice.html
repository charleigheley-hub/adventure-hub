<main>

<div class="card">

<h2>Roll the Dice</h2>

<button onclick="roll(20)">Roll D20</button>
<button onclick="roll(12)">Roll D12</button>
<button onclick="roll(10)">Roll D10</button>
<button onclick="roll(😎">Roll D8</button>
<button onclick="roll(6)">Roll D6</button>
<button onclick="roll(4)">Roll D4</button>

<h2 id="result">
Waiting for roll...
</h2>

<script>

function roll(sides){

let result = Math.floor(Math.random()*sides)+1;

document.getElementById("result").innerHTML =
"🎲 You rolled a " + result + " on a D" + sides;

}

</script>
